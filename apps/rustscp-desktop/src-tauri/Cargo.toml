[package]
name = "rustscp-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rustscp-core = { path = "../../../crates/rustscp-core" }
rustscp-actions = { path = "../../../crates/rustscp-actions" }
rustscp-mcp = { path = "../../../crates/rustscp-mcp" }
rustscp-cache = { path = "../../../crates/rustscp-cache" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tauri = { version = "2.1", features = [] }
md5 = "0.8.1"
hex = "0.4.3"
uuid.workspace = true
sha2.workspace = true
chrono.workspace = true
zeroize = "1"
# "Paste" in the terminal's menu (the WebView cannot read the clipboard on its own).
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# A double-clicked `.rustscp` file starts a second process on Windows / Linux; it hands
# the file to the running window instead.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSString", "NSUserDefaults"] }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
