[workspace]
resolver = "2"
members = [
    "crates/rustscp-core",
    "crates/rustscp-actions",
    "crates/rustscp-cache",
    "crates/rustscp-mcp",
    "apps/rustscp-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tiago Becker <tiagobecker@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiagobecker/RustSCP"
homepage = "https://github.com/tiagobecker/RustSCP"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
bytes = "1.10"
sha2 = "0.10"
regex = "1.11"
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
