[package]
name = "rustscp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
hmac = "0.12.1"
sha2.workspace = true
hex = "0.4.3"
base64 = "0.22.1"
notify = "8.2.0"
regex.workspace = true
libc = "0.2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
# PuTTY private keys (.ppk): AES-256-CBC, SHA-1/HMAC-SHA-1 (format 2) and Argon2 +
# HMAC-SHA-256 (format 3). bcrypt-pbkdf + AES-CTR re-encrypt a converted key in
# OpenSSH's own format for the system `ssh` client.
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
sha1 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
bcrypt-pbkdf = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
# FTPS (FTP over TLS). The same rustls build reqwest already uses: aws-lc-rs
# crypto and the operating system's certificate verifier.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# The local vault's device key lives in the macOS Keychain.
security-framework = "3"
core-foundation = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
